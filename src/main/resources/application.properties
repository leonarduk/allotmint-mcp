spring.application.name=allotmint-mcp
spring.main.banner-mode=off
spring.main.web-application-type=none

# Base URL of the AllotMint backend API. Override via the ALLOTMINT_API_BASE
# env var (Spring's relaxed binding maps it to this property automatically).
allotmint.api.base-url=${ALLOTMINT_API_BASE:http://localhost:8000}

# File access tool (allotmint_files). Both must be set for the tool to register.
# ALLOTMINT_MCP_FILES_ENABLED defaults to false: a fresh install never exposes files.
allotmint.mcp.files.enabled=${ALLOTMINT_MCP_FILES_ENABLED:false}
# ALLOTMINT_MCP_FILES_ROOT is the directory all file operations are confined to.
allotmint.mcp.files.root=${ALLOTMINT_MCP_FILES_ROOT:}
