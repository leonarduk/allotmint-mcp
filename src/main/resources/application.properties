spring.application.name=allotmint-mcp
spring.main.banner-mode=off
spring.main.web-application-type=none

# Base URL of the AllotMint backend API. Override via the ALLOTMINT_API_BASE
# env var (Spring's relaxed binding maps it to this property automatically).
allotmint.api.base-url=${ALLOTMINT_API_BASE:http://localhost:8000}

# Short-lived JWT issued by the AllotMint backend after Google login. Leave empty
# for unauthenticated local backends and public endpoints.
allotmint.mcp.auth-token=${ALLOTMINT_MCP_AUTH_TOKEN:}
