spring.application.name=allotmint-mcp
spring.main.banner-mode=off
spring.main.web-application-type=none

# Base URL of the AllotMint backend API. Override via the ALLOTMINT_API_BASE
# env var (Spring's relaxed binding maps it to this property automatically).
allotmint.api.base-url=${ALLOTMINT_API_BASE:http://localhost:8000}

# Short-lived JWT issued by the AllotMint backend after Google login. Leave empty
# for unauthenticated local backends and public endpoints.
allotmint.mcp.auth-token=${ALLOTMINT_MCP_AUTH_TOKEN:}

# Connect/read timeouts for calls to the AllotMint backend, so a misconfigured or
# unreachable ALLOTMINT_API_BASE (e.g. a host that accepts the TCP connection but
# never responds) fails fast instead of hanging indefinitely.
allotmint.api.connect-timeout-seconds=${ALLOTMINT_API_CONNECT_TIMEOUT_SECONDS:5}
allotmint.api.read-timeout-seconds=${ALLOTMINT_API_READ_TIMEOUT_SECONDS:15}
# --- allotmint_research (agentic RAG) -------------------------------------
# Opt-in: registers the allotmint_research tool. Requires the research agent
# sidecar (research-agent/) to be running, and this server to be started with
# --spring.profiles.active=http so the agent can call the v0 tools back over
# /mcp. Off by default because it is the server's first LLM dependency.
allotmint.mcp.research.enabled=${ALLOTMINT_MCP_RESEARCH_ENABLED:false}

# Opt-in write capability. The read-only reconciliation preview remains available.
allotmint.mcp.write.enabled=${ALLOTMINT_MCP_WRITE_ENABLED:false}

# Base URL of the research agent sidecar.
allotmint.research.base-url=${ALLOTMINT_RESEARCH_BASE_URL:http://localhost:8100}

# One call is a whole agent loop against a possibly-local LLM, so the read
# timeout is measured in minutes, not the seconds the backend API needs.
allotmint.research.connect-timeout-seconds=${ALLOTMINT_RESEARCH_CONNECT_TIMEOUT_SECONDS:5}
allotmint.research.read-timeout-seconds=${ALLOTMINT_RESEARCH_READ_TIMEOUT_SECONDS:180}
