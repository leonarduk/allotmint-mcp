version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python sidecars. Their requirements are open ranges (e.g. `mcp>=1.9,<3`)
  # with no lockfile. "increase" raises the lower bound to each new release,
  # so a security fix the range already allows, e.g. a patched mcp 2.x, still
  # gets a PR that lifts the floor past the vulnerable versions; a release
  # outside the cap (mcp 3.0) gets a PR too. The cost is one PR per upstream
  # release;
  # "increase-if-necessary" would cut that to out-of-range releases only
  # (a new major like mcp 3.0) but let in-range security fixes pass silently.
  #
  # scripts/requirements-dev.txt is left out: it is a private git dependency
  # that update-cicaid.yml already bumps.
  - package-ecosystem: "pip"
    directories:
      - "/mcp-client"
      - "/research-agent"
    schedule:
      interval: "weekly"
    versioning-strategy: "increase"
    # One PR per directory per week for routine minor/patch bumps. Majors stay
    # out of the group so a release past a cap (mcp 3.0) gets its own PR, and
    # groups default to version updates only, so security fixes keep theirs.
    groups:
      python-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
