name: Docker Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{raw}}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # This repo is public, and the image has in practice been public since its
      # first publish regardless of the assumption below - GHCR package visibility
      # appears to inherit the repository's own visibility rather than defaulting
      # to private, at least for a public repo publishing via GITHUB_TOKEN. The
      # image was audited (allotmint-mcp#645) and contains no secrets: every
      # sensitive config value is externalized via env vars with safe defaults,
      # and the Dockerfile only COPYs source/build files, never local config or
      # data. So public is the intended, not accidental, visibility here.
      # GITHUB_TOKEN cannot change package visibility (that requires a PAT with
      # package admin rights), so if this ever fails, fix it manually under the
      # package's GitHub settings.
      - name: Assert package visibility is public
        run: |
          repo_name="${IMAGE_NAME##*/}"
          if ! visibility=$(gh api "/users/${{ github.repository_owner }}/packages/container/${repo_name}" --jq .visibility 2>/tmp/gh_api_err); then
            echo "::warning::Could not read ghcr.io/${IMAGE_NAME} package visibility (it may not have finished propagating after the first publish): $(cat /tmp/gh_api_err)"
            exit 0
          fi
          echo "Package visibility: $visibility"
          if [ "$visibility" != "public" ]; then
            echo "::error::ghcr.io/${IMAGE_NAME} is '$visibility', expected 'public'. Fix under the package's GitHub settings (Package settings > Danger Zone > Change visibility)."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
