name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build fat JAR
        run: ./mvnw -B package

      - name: Locate fat JAR
        id: jar
        run: |
          jar_path=$(find target -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -print -quit)
          if [ -z "$jar_path" ]; then
            echo "::error::No fat JAR found under target/"
            exit 1
          fi
          echo "path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.jar.outputs.path }}
          generate_release_notes: true
