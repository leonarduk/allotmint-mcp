name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine cache week
        id: week
        run: echo "value=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@v6
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ steps.week.outputs.value }}
          restore-keys: dependency-check-data-

      - name: Build and test
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B verify

  research-agent:
    # The Python sidecar behind allotmint_research. Its tests stub the LLM, the
    # MCP transport, and the retrieval store, so this job needs no services and
    # no model download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research-agent/requirements-dev.txt

      - name: Install test dependencies
        working-directory: research-agent
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: research-agent
        run: python -m pytest -q

  mcp-client:
    # The CLI client for testing allotmint_research (issue #256). Its tests use
    # a fake MCP session, so this job needs no running server, sidecar, or model.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: mcp-client/requirements-dev.txt

      - name: Install test dependencies
        working-directory: mcp-client
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: mcp-client
        run: python -m pytest -q

  dev-tools:
    # Verify the shared cicaid-devtools package installs and its console
    # scripts are functional. This catches a broken release wheel, missing
    # asset, or import error before a developer hits it locally.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cicaid-devtools
        run: python -m pip install -r scripts/requirements-dev.txt

      - name: Verify console scripts are importable
        run: |
          set -euo pipefail
          # Every console-script entry point (per the package's
          # entry_points.txt) must import without error (catches missing
          # modules, broken wheels, dependency issues). None are invoked:
          # most read sys.argv directly and would try to act on a CI runner.
          python -c "import cicaid_devtools.a_sync_issues"
          python -c "import cicaid_devtools.b_create_issue"
          python -c "import cicaid_devtools.c_triage_issues"
          python -c "import cicaid_devtools.d_work_on_issue"
          python -c "import cicaid_devtools.e_work_on_pr"
          python -c "import cicaid_devtools.f_implement_issue_with_aider"
          python -c "import cicaid_devtools.h_run_ci_checks"
          python -c "import cicaid_devtools.i_local_review"
          python -c "import cicaid_devtools.l_pr_review"
          python -c "import cicaid_devtools.m_dependabot_auto_merge"
          python -c "import cicaid_devtools.o_review_issue"
          python -c "import cicaid_devtools.p_add_issue_to_pr"
          python -c "import cicaid_devtools.q_clear_ai_slop_issues"
          python -c "import cicaid_devtools.lib.commit_and_push"
          python -c "import cicaid_devtools.lib.publish_pr"
