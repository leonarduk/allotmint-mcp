name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Determine cache week
        id: week
        run: echo "value=$(date +%Y-%U)" >> "$GITHUB_OUTPUT"

      - name: Cache OWASP dependency-check NVD data
        uses: actions/cache@v6
        with:
          path: .dependency-check-data
          key: dependency-check-data-${{ steps.week.outputs.value }}
          restore-keys: dependency-check-data-

      - name: Build and test
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: ./mvnw -B verify

  research-agent:
    # The Python sidecar behind allotmint_research. Its tests stub the LLM, the
    # MCP transport, and the retrieval store, so this job needs no services and
    # no model download.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: research-agent/requirements-dev.txt

      - name: Install test dependencies
        working-directory: research-agent
        run: pip install -r requirements-dev.txt

      - name: Test
        working-directory: research-agent
        run: python -m pytest -q
