# Supporting services for the allotmint_research tool. `docker compose up -d`
# starts the retrieval store on its own; the research agent sidecar is behind
# the `research` profile because it needs an LLM (a local Ollama, by default)
# reachable from inside the container:
#
#   docker compose --profile research up -d
#
# Container names are deliberately not set here — Compose derives per-project
# names (e.g. ${COMPOSE_PROJECT_NAME}-pgvector-1). Hardcoded container_name
# values are global to the Docker daemon and collide when two checkouts of this
# repo run compose on the same machine ("Conflict: container name already in
# use", or worse, an invisible network mismatch). Use `docker compose ps` to
# find the actual container names in your checkout.
#
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: allotmint_research
      POSTGRES_USER: allotmint
      POSTGRES_PASSWORD: allotmint
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allotmint -d allotmint_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  research-agent:
    profiles: ["research"]
    build: ./research-agent
    ports:
      - "8100:8100"
    environment:
      ALLOTMINT_RESEARCH_DB_DSN: postgresql://allotmint:allotmint@pgvector:5432/allotmint_research
      # host.docker.internal reaches Ollama and the MCP server running on the
      # host; override both if they run elsewhere.
      ALLOTMINT_RESEARCH_LLM_BASE_URL: http://host.docker.internal:11434/v1
      ALLOTMINT_RESEARCH_MCP_URL: http://host.docker.internal:8080/mcp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data:
