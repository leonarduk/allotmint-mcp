# Supporting services for the allotmint_research tool. `docker compose up -d`
# starts the retrieval store on its own; the research agent sidecar is behind
# the `research` profile because it needs an LLM (a local Ollama, by default)
# reachable from inside the container:
#
#   docker compose --profile research up -d
#
services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: allotmint_research
      POSTGRES_USER: allotmint
      POSTGRES_PASSWORD: allotmint
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allotmint -d allotmint_research"]
      interval: 5s
      timeout: 5s
      retries: 10

  research-agent:
    profiles: ["research"]
    build: ./research-agent
    ports:
      - "8100:8100"
    environment:
      ALLOTMINT_RESEARCH_DB_DSN: postgresql://allotmint:allotmint@pgvector:5432/allotmint_research
      ALLOTMINT_RESEARCH_MCP_URL: http://host.docker.internal:8080/mcp
      # LLM provider selection (see research-agent/README.md#configuration).
      # Defaults reproduce the previous local-only behavior; override any of
      # these in a `.env` file at the repo root (docker compose loads it
      # automatically, and it's already gitignored) to switch providers
      # without touching this file, e.g.:
      #   ALLOTMINT_RESEARCH_LLM_PROVIDER=deepseek
      #   ALLOTMINT_RESEARCH_LLM_MODEL=deepseek-chat
      #   ALLOTMINT_RESEARCH_LLM_API_KEY=sk-...
      # ALLOTMINT_RESEARCH_LLM_BASE_URL only matters for the ollama and
      # openai-compatible providers; host.docker.internal is what reaches an
      # Ollama server running on the host from inside this container.
      ALLOTMINT_RESEARCH_LLM_PROVIDER: ${ALLOTMINT_RESEARCH_LLM_PROVIDER:-ollama}
      ALLOTMINT_RESEARCH_AVAILABLE_LLM_PROVIDERS: ${ALLOTMINT_RESEARCH_AVAILABLE_LLM_PROVIDERS:-ollama}
      ALLOTMINT_RESEARCH_DEEPSEEK_API_KEY: ${ALLOTMINT_RESEARCH_DEEPSEEK_API_KEY:-}
      ALLOTMINT_RESEARCH_DEEPSEEK_MODEL: ${ALLOTMINT_RESEARCH_DEEPSEEK_MODEL:-deepseek-chat}
      ALLOTMINT_RESEARCH_DEEPSEEK_BASE_URL: ${ALLOTMINT_RESEARCH_DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      ALLOTMINT_RESEARCH_LLM_MODEL: ${ALLOTMINT_RESEARCH_LLM_MODEL:-llama3.2}
      ALLOTMINT_RESEARCH_LLM_BASE_URL: ${ALLOTMINT_RESEARCH_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      ALLOTMINT_RESEARCH_LLM_API_KEY: ${ALLOTMINT_RESEARCH_LLM_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      pgvector:
        condition: service_healthy

volumes:
  pgvector_data:
