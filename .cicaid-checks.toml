# Local check list for `run-ci-checks` (from the cicaid-devtools package).
# Mirrors the credential-free parts of .github/workflows/build.yml.
#
# NOTE: The "build" check runs `./mvnw verify`, which includes OWASP
# dependency-check.  That step needs an NVD_API_KEY for the National
# Vulnerability Database feed.  In CI the key is a repository secret;
# for local runs, set NVD_API_KEY in your environment or the check will
# proceed with a slower, rate-limited download.  See
# https://github.com/jeremylong/DependencyCheck?tab=readme-ov-file#nvd-api-key

[[checks]]
name = "build"
description = "Maven build, tests, Spotless, JaCoCo, and OWASP dependency-check"
workflow = ".github/workflows/build.yml (build)"
commands = ["./mvnw -B verify"]

[[checks]]
name = "research-agent"
description = "Python tests for the allotmint_research sidecar"
workflow = ".github/workflows/build.yml (research-agent)"
commands = ["pip install -r research-agent/requirements-dev.txt", "python -m pytest -q research-agent"]

[[checks]]
name = "mcp-client"
description = "Python tests for the allotmint_research CLI test client"
workflow = ".github/workflows/build.yml (mcp-client)"
commands = ["pip install -r mcp-client/requirements-dev.txt", "python -m pytest -q mcp-client"]
